// ============ SCORE CALCULATION ============
function calcScores(answers, originAnswers) {
  const layerScores = { I: 0, C: 0, M: 0, W: 0 };
  let total = 0;
  QUESTIONS.forEach((q, i) => {
    const raw = answers[i] || 3;
    const score = q.inv ? (6 - raw) : raw;
    layerScores[q.l] += score;
    total += score;
  });
  const abundance = Math.round((1 - (total - 100) / 400) * 100);
  const layerAbundance = {};
  for (const l of ["I", "C", "M", "W"]) {
    layerAbundance[l] = Math.round((1 - (layerScores[l] - 25) / 100) * 100);
  }
  let weakest = "I", lowestPct = 100;
  for (const l of ["I", "C", "M", "W"]) {
    if (layerAbundance[l] < lowestPct) { lowestPct = layerAbundance[l]; weakest = l; }
  }
  let originTotal = 0;
  ORIGIN_QUESTIONS.forEach((_, i) => { originTotal += (originAnswers[i] || 3); });
  let originLevel = originTotal > 50 ? "profundas" : originTotal > 30 ? "moderadas" : "superficiais";
  let profile, profileColor;
  if (total <= 200) { profile = "Mentalidade Abundante"; profileColor = "#10B981"; }
  else if (total <= 300) { profile = "Mentalidade Mista"; profileColor = "#EAB308"; }
  else if (total <= 400) { profile = "Mentalidade Limitante"; profileColor = "#D4764A"; }
  else { profile = "Mentalidade Altamente Limitante"; profileColor = "#EF4444"; }
  // High-scoring origin questions
  const hotOrigins = [];
  ORIGIN_QUESTIONS.forEach((q, i) => { if ((originAnswers[i] || 3) >= 4) hotOrigins.push(q.id); });
  return { total, abundance, layerScores, layerAbundance, weakest, originTotal, originLevel, profile, profileColor, hotOrigins };
}

function TiaCrencaApp() {
  const [phase, setPhase] = useState("loading");
  const [current, setCurrent] = useState(0);
  const [answers, setAnswers] = useState({});
  const [originAnswers, setOriginAnswers] = useState({});
  const [selected, setSelected] = useState(null);
  const [savedResult, setSavedResult] = useState(null);
  const [returnMode, setReturnMode] = useState(false);
  const [returnAnswers, setReturnAnswers] = useState({});
  const [returnCurrent, setReturnCurrent] = useState(0);
  const [returnSelected, setReturnSelected] = useState(null);
  const [showReturnResult, setShowReturnResult] = useState(false);
  const topRef = useRef(null);

  const totalQ = QUESTIONS.length;
  const totalO = ORIGIN_QUESTIONS.length;

  // Load saved state on mount
  useEffect(() => {
    (() => {
      const progress = loadProgress();
      const result = loadResult();
      if (result) {
        setSavedResult(result);
        setPhase("hasResult");
      } else if (progress) {
        setPhase(progress.phase);
        setCurrent(progress.current);
        setAnswers(progress.answers || {});
        setOriginAnswers(progress.originAnswers || {});
        setSelected(null);
      } else {
        setPhase("intro");
      }
    })();
  }, []);

  // Auto-save progress
  useEffect(() => {
    if (phase === "quiz" || phase === "origin") {
      saveProgress({ phase, current, answers, originAnswers });
    }
  }, [phase, current, answers, originAnswers]);

  const scrollTop = () => topRef.current?.scrollIntoView({ behavior: "smooth", block: "start" });

  const selectAnswer = (val) => {
    setSelected(val);
    if (phase === "quiz") setAnswers(p => ({ ...p, [current]: val }));
    else if (phase === "origin") setOriginAnswers(p => ({ ...p, [current]: val }));
  };

  const goNext = () => {
    if (selected === null) return;
    if (phase === "quiz") {
      if (current < totalQ - 1) { setCurrent(current + 1); setSelected(answers[current + 1] ?? null); }
      else { setPhase("origin"); setCurrent(0); setSelected(originAnswers[0] ?? null); }
    } else if (phase === "origin") {
      if (current < totalO - 1) { setCurrent(current + 1); setSelected(originAnswers[current + 1] ?? null); }
      else { finishQuiz(); }
    }
    scrollTop();
  };

  const goPrev = () => {
    if (phase === "quiz" && current > 0) { setCurrent(current - 1); setSelected(answers[current - 1] ?? null); }
    else if (phase === "origin" && current > 0) { setCurrent(current - 1); setSelected(originAnswers[current - 1] ?? null); }
    else if (phase === "origin" && current === 0) { setPhase("quiz"); setCurrent(totalQ - 1); setSelected(answers[totalQ - 1] ?? null); }
    scrollTop();
  };

  const finishQuiz = () => {
    const scores = calcScores(answers, originAnswers);
    const resultData = { ...scores, date: new Date().toISOString(), answers, originAnswers };
    saveResult(resultData);
    clearProgress();
    setSavedResult(resultData);
    setPhase("result");
  };

  const startFresh = () => {
    clearProgress();
    setAnswers({}); setOriginAnswers({}); setCurrent(0); setSelected(null);
    setPhase("quiz");
  };

  // Return questionnaire (focused on weakest layer)
  const getReturnQuestions = () => {
    if (!savedResult) return [];
    const weak = savedResult.weakest;
    return QUESTIONS.filter(q => q.l === weak);
  };

  const startReturn = () => {
    setReturnMode(true); setReturnCurrent(0); setReturnAnswers({}); setReturnSelected(null); setShowReturnResult(false);
  };

  const canDoReturn = () => {
    if (!savedResult?.date) return true;
    const diff = Date.now() - new Date(savedResult.date).getTime();
    return diff >= 21 * 24 * 60 * 60 * 1000;
  };

  const daysUntilReturn = () => {
    if (!savedResult?.date) return 0;
    const diff = 21 - Math.floor((Date.now() - new Date(savedResult.date).getTime()) / (24 * 60 * 60 * 1000));
    return Math.max(0, diff);
  };

  const globalProgress = phase === "quiz" ? ((current + 1) / (totalQ + totalO)) * 100
    : phase === "origin" ? ((totalQ + current + 1) / (totalQ + totalO)) * 100 : 100;

  // ============ LOADING ============
  if (phase === "loading") {
    return (
      <div style={{ minHeight: "100vh", background: "#2E2538", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Montserrat', sans-serif" }}>
        <div style={{ textAlign: "center" }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: "#D4764A", letterSpacing: "0.2em" }}>TIA CRENÇA</div>
          <p style={{ color: "#C4C2C9", fontSize: 13, marginTop: 12 }}>Carregando...</p>
        </div>
      </div>
    );
  }

  // ============ HAS PREVIOUS RESULT ============
  if (phase === "hasResult" && savedResult && !returnMode) {
    const days = daysUntilReturn();
    const canReturn = canDoReturn();
    return (
      <div style={{ minHeight: "100vh", background: "#2E2538", display: "flex", alignItems: "center", justifyContent: "center", padding: 24, fontFamily: "'Montserrat', sans-serif" }}>
        <div style={{ maxWidth: 480, textAlign: "center" }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: "#D4764A", letterSpacing: "0.2em", textTransform: "uppercase", marginBottom: 20 }}>TIA CRENÇA</div>
          <h2 style={{ fontSize: 20, fontWeight: 900, color: "#EFEBE2", textTransform: "uppercase", marginBottom: 8 }}>Bem-vindo(a) de volta</h2>
          <p style={{ color: "#C4C2C9", fontSize: 13, lineHeight: 1.7, marginBottom: 24 }}>
            Seu último diagnóstico: <strong style={{ color: savedResult.profileColor }}>{savedResult.abundance}% abundância</strong>
            <br />Camada mais fraca: <strong style={{ color: LAYER_COLORS[savedResult.weakest] }}>{LAYER_NAMES[savedResult.weakest]}</strong>
          </p>

          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            {canReturn ? (
              <Btn primary onClick={startReturn} style={{ width: "100%" }}>
                Questionário de Retorno (camada {LAYER_NAMES[savedResult.weakest]})
              </Btn>
            ) : (
              <div style={{ background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.08)", borderRadius: 12, padding: 20 }}>
                <p style={{ color: "#C4C2C9", fontSize: 12, lineHeight: 1.7, margin: 0 }}>
                  O questionário de retorno será liberado em <strong style={{ color: "#D4764A" }}>{days} dias</strong>.
                  <br />Continue seguindo o plano de ação dos 3 níveis.
                </p>
              </div>
            )}
            <Btn onClick={() => setPhase("result")} style={{ width: "100%" }}>
              Ver meu diagnóstico anterior
            </Btn>
            <Btn onClick={startFresh} style={{ width: "100%", fontSize: 10, opacity: 0.6 }}>
              Refazer questionário completo (115 perguntas)
            </Btn>
          </div>
        </div>
      </div>
    );
  }

  // ============ RETURN QUESTIONNAIRE ============
  if (returnMode && !showReturnResult) {
    const rQuestions = getReturnQuestions();
    const rq = rQuestions[returnCurrent];
    if (!rq) return null;
    const rProgress = ((returnCurrent + 1) / rQuestions.length) * 100;

    return (
      <div ref={topRef} style={{ minHeight: "100vh", background: "#F5F2ED", fontFamily: "'Montserrat', sans-serif" }}>
        <div style={{ background: "#2E2538", padding: "12px 24px" }}>
          <div style={{ maxWidth: 600, margin: "0 auto", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span style={{ fontSize: 11, fontWeight: 700, color: "#D4764A", letterSpacing: "0.15em" }}>RETORNO · {LAYER_NAMES[savedResult.weakest]}</span>
            <span style={{ fontSize: 10, color: "#C4C2C9" }}>{returnCurrent + 1} de {rQuestions.length}</span>
          </div>
          <div style={{ maxWidth: 600, margin: "8px auto 0", height: 3, background: "rgba(255,255,255,0.06)", borderRadius: 2, overflow: "hidden" }}>
            <div style={{ height: "100%", width: `${rProgress}%`, background: LAYER_COLORS[savedResult.weakest], borderRadius: 2, transition: "width 0.4s ease" }} />
          </div>
        </div>
        <div style={{ maxWidth: 600, margin: "0 auto", padding: "24px 24px 48px" }}>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 24 }}>
            <span style={{ fontSize: 10, fontWeight: 700, color: LAYER_COLORS[savedResult.weakest], textTransform: "uppercase", letterSpacing: "0.12em" }}>QUESTIONÁRIO DE DESENVOLVIMENTO</span>
          </div>
          <div style={{ background: "#fff", borderRadius: 16, padding: "32px 24px", boxShadow: "0 8px 32px rgba(46,37,56,0.06)", borderLeft: `4px solid ${LAYER_COLORS[savedResult.weakest]}` }}>
            {rq.inv && <span style={{ fontSize: 9, fontWeight: 700, color: "#D4764A", background: "rgba(212,118,74,0.08)", padding: "3px 10px", borderRadius: 100, display: "inline-block", marginBottom: 12 }}>INVERTIDA</span>}
            <p style={{ fontSize: 17, fontWeight: 700, color: "#1a1520", lineHeight: 1.5, marginBottom: 24 }}>"{rq.t}"</p>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {LABELS.map((label, i) => {
                const val = i + 1;
                const isSel = returnSelected === val;
                return (
                  <button key={val} onClick={() => { setReturnSelected(val); setReturnAnswers(p => ({ ...p, [returnCurrent]: val })); }}
                    style={{ display: "flex", alignItems: "center", gap: 12, padding: "14px 16px", background: isSel ? "rgba(212,118,74,0.08)" : "#F5F2ED", border: isSel ? "2px solid #D4764A" : "2px solid transparent", borderRadius: 10, cursor: "pointer", fontFamily: "inherit", textAlign: "left" }}>
                    <div style={{ flexShrink: 0, width: 32, height: 32, borderRadius: "50%", background: isSel ? "#D4764A" : "rgba(0,0,0,0.04)", color: isSel ? "#fff" : "#8a8490", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 800, fontSize: 14 }}>{val}</div>
                    <span style={{ fontSize: 13, fontWeight: isSel ? 700 : 500, color: isSel ? "#D4764A" : "#5a5060" }}>{label}</span>
                  </button>
                );
              })}
            </div>
          </div>
          <div style={{ display: "flex", gap: 12, marginTop: 20 }}>
            <Btn disabled={returnCurrent === 0} onClick={() => { setReturnCurrent(returnCurrent - 1); setReturnSelected(returnAnswers[returnCurrent - 1] ?? null); scrollTop(); }} style={{ flex: 1 }}>Anterior</Btn>
            <Btn primary disabled={returnSelected === null} onClick={() => {
              if (returnCurrent < rQuestions.length - 1) { setReturnCurrent(returnCurrent + 1); setReturnSelected(returnAnswers[returnCurrent + 1] ?? null); scrollTop(); }
              else { setShowReturnResult(true); scrollTop(); }
            }} style={{ flex: 2 }}>
              {returnCurrent === rQuestions.length - 1 ? "Ver evolução" : "Próxima"}
            </Btn>
          </div>
        </div>
      </div>
    );
  }

  // ============ RETURN RESULT ============
  if (returnMode && showReturnResult) {
    const rQuestions = getReturnQuestions();
    const weak = savedResult.weakest;
    let rScore = 0;
    rQuestions.forEach((q, i) => {
      const raw = returnAnswers[i] || 3;
      rScore += q.inv ? (6 - raw) : raw;
    });
    const newPct = Math.round((1 - (rScore - 25) / 100) * 100);
    const oldPct = savedResult.layerAbundance[weak];
    const diff = newPct - oldPct;

    return (
      <div ref={topRef} style={{ minHeight: "100vh", background: "#F5F2ED", fontFamily: "'Montserrat', sans-serif" }}>
        <div style={{ background: "#2E2538", padding: "48px 24px", textAlign: "center" }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: "#D4764A", letterSpacing: "0.2em", marginBottom: 16 }}>SUA EVOLUÇÃO · {LAYER_NAMES[weak]}</div>
          <div style={{ display: "flex", justifyContent: "center", alignItems: "center", gap: 24, flexWrap: "wrap" }}>
            <div>
              <div style={{ fontSize: 12, color: "#C4C2C9", marginBottom: 4 }}>Antes</div>
              <div style={{ fontSize: 40, fontWeight: 900, color: "#C4C2C9" }}>{oldPct}%</div>
            </div>
            <div style={{ fontSize: 24, color: "#D4764A" }}>→</div>
            <div>
              <div style={{ fontSize: 12, color: diff > 0 ? "#10B981" : "#EF4444", marginBottom: 4 }}>Agora</div>
              <div style={{ fontSize: 56, fontWeight: 900, color: diff > 0 ? "#10B981" : "#EF4444" }}>{newPct}%</div>
            </div>
          </div>
          <div style={{ marginTop: 16, display: "inline-block", padding: "8px 20px", borderRadius: 100, background: diff > 0 ? "rgba(16,185,113,0.15)" : "rgba(239,68,68,0.15)" }}>
            <span style={{ fontSize: 14, fontWeight: 700, color: diff > 0 ? "#10B981" : "#EF4444" }}>
              {diff > 0 ? `+${diff}% de evolução` : diff === 0 ? "Mesmo nível" : `${diff}% (atenção)`}
            </span>
          </div>
        </div>
        <div style={{ maxWidth: 500, margin: "0 auto", padding: "32px 24px", textAlign: "center" }}>
          <p style={{ fontSize: 14, color: "#5a5060", lineHeight: 1.8, marginBottom: 24 }}>
            {diff > 5
              ? "Parabéns! O protocolo de 21 dias está funcionando. Suas crenças na camada " + LAYER_NAMES[weak] + " estão se transformando. Continue com as práticas diárias e refaça novamente em 21 dias."
              : diff > 0
              ? "Evolução sutil, mas real. A mudança de crenças profundas leva tempo. Continue com o protocolo e refaça em mais 21 dias."
              : "Suas crenças nessa camada ainda estão fortes. Intensifique os exercícios do Nível 2 (trabalho com a raiz) e considere acompanhamento profissional."
            }
          </p>
          <Btn primary onClick={() => { setReturnMode(false); setPhase("hasResult"); }} style={{ width: "100%", maxWidth: 320 }}>Voltar ao painel</Btn>
        </div>
      </div>
    );
  }

  // ============ INTRO ============
  if (phase === "intro") {
    return (
      <div style={{ minHeight: "100vh", background: "#2E2538", display: "flex", alignItems: "center", justifyContent: "center", padding: 24, fontFamily: "'Montserrat', sans-serif" }}>
        <div style={{ maxWidth: 520, textAlign: "center" }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: "#D4764A", letterSpacing: "0.2em", textTransform: "uppercase", marginBottom: 20 }}>TIA CRENÇA</div>
          <h1 style={{ fontSize: "clamp(1.6rem, 4vw, 2.2rem)", fontWeight: 900, color: "#EFEBE2", lineHeight: 1.15, marginBottom: 16, textTransform: "uppercase" }}>
            Questionário das 100 Crenças Limitantes + 15 de Origem
          </h1>
          <p style={{ color: "#C4C2C9", fontSize: 13, lineHeight: 1.8, marginBottom: 32 }}>
            Descubra as crenças que travam sua vida financeira. Receba seu diagnóstico nas 4 camadas, score de origem e plano de ação personalizado de 21 dias.
          </p>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 32 }}>
            {[{ n: "100", l: "Crenças mapeadas" }, { n: "4", l: "Camadas reveladas" }, { n: "15", l: "Perguntas de origem" }, { n: "1", l: "Plano de ação" }].map((s, i) => (
              <div key={i} style={{ background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.06)", borderRadius: 12, padding: "16px 12px", textAlign: "center" }}>
                <div style={{ fontWeight: 900, fontSize: 22, color: "#D4764A" }}>{s.n}</div>
                <div style={{ fontSize: 10, color: "#C4C2C9", textTransform: "uppercase", letterSpacing: "0.08em", marginTop: 4, fontWeight: 600 }}>{s.l}</div>
              </div>
            ))}
          </div>
          <Btn primary onClick={startFresh} style={{ width: "100%" }}>Começar o questionário</Btn>
          <p style={{ color: "rgba(255,255,255,0.25)", fontSize: 11, marginTop: 16 }}>Tempo estimado: 15-20 minutos · Seu progresso é salvo automaticamente</p>
        </div>
      </div>
    );
  }

  // ============ RESULT ============
  if (phase === "result") {
    const scores = savedResult || calcScores(answers, originAnswers);
    const action = LAYER_ACTIONS[scores.weakest];
    return (
      <div ref={topRef} style={{ minHeight: "100vh", background: "#F5F2ED", fontFamily: "'Montserrat', sans-serif" }}>
        <div style={{ background: "#2E2538", padding: "48px 24px", textAlign: "center" }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: "#D4764A", letterSpacing: "0.2em", marginBottom: 12 }}>SEU DIAGNÓSTICO COMPLETO</div>
          <div style={{ fontSize: "clamp(3.5rem, 10vw, 5rem)", fontWeight: 900, color: scores.profileColor, lineHeight: 1 }}>{scores.abundance}%</div>
          <div style={{ fontSize: 12, fontWeight: 700, color: "#C4C2C9", textTransform: "uppercase", letterSpacing: "0.1em", marginTop: 8 }}>Mentalidade Abundante</div>
          <div style={{ marginTop: 12, display: "inline-block", padding: "8px 20px", borderRadius: 100, background: `${scores.profileColor}22`, border: `1px solid ${scores.profileColor}44` }}>
            <span style={{ fontSize: 13, fontWeight: 700, color: scores.profileColor }}>{scores.profile}</span>
          </div>
          <div style={{ maxWidth: 400, margin: "24px auto 0", height: 8, background: "rgba(255,255,255,0.08)", borderRadius: 4, overflow: "hidden" }}>
            <div style={{ height: "100%", width: `${scores.abundance}%`, background: "linear-gradient(90deg, #EF4444, #D4764A, #EAB308, #10B981)", borderRadius: 4 }} />
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", maxWidth: 400, margin: "6px auto 0", fontSize: 10, color: "#C4C2C9" }}>
            <span>Escassez</span><span>Abundância</span>
          </div>
        </div>

        <div style={{ maxWidth: 600, margin: "0 auto", padding: "32px 24px" }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: "#D4764A", letterSpacing: "0.2em", marginBottom: 16 }}>DIAGNÓSTICO POR CAMADA</div>
          {["I", "C", "M", "W"].map(l => <LayerBar key={l} layer={l} pct={scores.layerAbundance[l]} isWeakest={l === scores.weakest} />)}

          {/* Origin */}
          <div style={{ marginTop: 28, background: "#2E2538", borderRadius: 12, padding: "24px 20px", textAlign: "center" }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: "#D4764A", letterSpacing: "0.2em", marginBottom: 8 }}>SCORE DE ORIGEM</div>
            <div style={{ fontSize: 48, fontWeight: 900, color: "#EFEBE2", lineHeight: 1 }}>{scores.originTotal}<span style={{ fontSize: 16, color: "#C4C2C9" }}>/75</span></div>
            <div style={{ marginTop: 10, display: "inline-block", padding: "5px 14px", borderRadius: 100, background: scores.originLevel === "profundas" ? "rgba(239,68,68,0.15)" : scores.originLevel === "moderadas" ? "rgba(212,118,74,0.15)" : "rgba(16,185,113,0.15)" }}>
              <span style={{ fontSize: 12, fontWeight: 700, color: scores.originLevel === "profundas" ? "#EF4444" : scores.originLevel === "moderadas" ? "#D4764A" : "#10B981" }}>Raízes {scores.originLevel}</span>
            </div>
          </div>

          {/* PLAN */}
          <div style={{ fontSize: 11, fontWeight: 700, color: "#D4764A", letterSpacing: "0.2em", marginTop: 32, marginBottom: 16 }}>PLANO DE AÇÃO · PROTOCOLO 21 DIAS</div>

          {/* Level 1 */}
          <div style={{ background: "#fff", borderRadius: 12, padding: "24px 20px", marginBottom: 14, borderLeft: `4px solid ${LAYER_COLORS[scores.weakest]}` }}>
            <div style={{ fontSize: 10, fontWeight: 700, color: LAYER_COLORS[scores.weakest], textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 4 }}>NÍVEL 1</div>
            <h3 style={{ fontSize: 14, fontWeight: 800, marginBottom: 6 }}>REPROGRAMAÇÃO: {action.title}</h3>
            <p style={{ fontSize: 12, color: "#5a5060", lineHeight: 1.7, marginBottom: 16 }}>{action.desc}</p>
            {action.exercises.map((ex, i) => (
              <div key={i} style={{ marginBottom: 14, padding: 14, background: "#F5F2ED", borderRadius: 8 }}>
                <div style={{ fontSize: 11, fontWeight: 800, color: LAYER_COLORS[scores.weakest], marginBottom: 4 }}>{ex.title}</div>
                <p style={{ fontSize: 12, color: "#5a5060", lineHeight: 1.6, margin: 0 }}>{ex.desc}</p>
              </div>
            ))}
          </div>

          {/* Level 2 */}
          {scores.originTotal > 30 && (
            <div style={{ background: "#fff", borderRadius: 12, padding: "24px 20px", marginBottom: 14, borderLeft: "4px solid #8B4513" }}>
              <div style={{ fontSize: 10, fontWeight: 700, color: "#8B4513", textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 4 }}>NÍVEL 2</div>
              <h3 style={{ fontSize: 14, fontWeight: 800, marginBottom: 6 }}>TRABALHO COM A RAIZ</h3>
              <p style={{ fontSize: 12, color: "#5a5060", lineHeight: 1.7, marginBottom: 16 }}>Score de origem: {scores.originTotal}/75 (raízes {scores.originLevel}). Estes exercícios acessam a memória emocional original.</p>
              {ORIGIN_ACTIONS.map((oa, i) => (
                <div key={i} style={{ marginBottom: 14, padding: 14, background: "#F5F2ED", borderRadius: 8 }}>
                  <div style={{ fontSize: 11, fontWeight: 800, color: "#8B4513", marginBottom: 4 }}>{oa.icon} {oa.title}</div>
                  <div style={{ fontSize: 10, color: "#8a8490", marginBottom: 6 }}>Baseado nas perguntas {oa.range}</div>
                  <p style={{ fontSize: 12, color: "#5a5060", lineHeight: 1.6, margin: 0 }}>{oa.desc}</p>
                </div>
              ))}
            </div>
          )}

          {/* Level 3 */}
          <div style={{ background: "#fff", borderRadius: 12, padding: "24px 20px", marginBottom: 14, borderLeft: "4px solid #10B981" }}>
            <div style={{ fontSize: 10, fontWeight: 700, color: "#10B981", textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 4 }}>NÍVEL 3</div>
            <h3 style={{ fontSize: 14, fontWeight: 800, marginBottom: 12 }}>PRÁTICAS DIÁRIAS (21 DIAS)</h3>
            {[
              { time: "☀️ Manhã (5 min)", desc: "Leia suas afirmações da camada " + LAYER_NAMES[scores.weakest] + " em voz alta." },
              { time: "🌤️ Tarde (2 min)", desc: "Quando a Tia Crença falar, reconheça: 'Essa não sou eu. É uma crença antiga.' E siga em frente." },
              { time: "🌙 Noite (5 min)", desc: "Escreva 3 evidências do dia de que você é capaz, merece e pode." },
            ].map((p, i) => (
              <div key={i} style={{ display: "flex", gap: 12, marginBottom: 12, padding: 12, background: "#F5F2ED", borderRadius: 8 }}>
                <div style={{ flexShrink: 0, fontSize: 12, fontWeight: 700, color: "#10B981", minWidth: 110 }}>{p.time}</div>
                <p style={{ fontSize: 12, color: "#5a5060", lineHeight: 1.6, margin: 0 }}>{p.desc}</p>
              </div>
            ))}
          </div>

          {/* Return CTA */}
          <div style={{ textAlign: "center", marginTop: 32, padding: "28px 20px", background: "#2E2538", borderRadius: 12 }}>
            <p style={{ fontSize: 13, color: "#C4C2C9", lineHeight: 1.7, marginBottom: 4 }}>Após 21 dias de protocolo, volte para medir sua evolução.</p>
            <p style={{ fontSize: 11, color: "#D4764A", fontWeight: 700, marginBottom: 16 }}>
              Questionário de retorno: apenas 25 perguntas da camada {LAYER_NAMES[scores.weakest]}
            </p>
            <Btn primary onClick={() => setPhase("hasResult")} style={{ width: "100%", maxWidth: 300 }}>Voltar ao painel</Btn>
          </div>

          <p style={{ textAlign: "center", fontSize: 11, color: "#8a8490", marginTop: 24, fontStyle: "italic" }}>
            "Pare de obedecer vozes que você nunca pediu para ouvir."
          </p>
        </div>
      </div>
    );
  }

  // ============ QUIZ / ORIGIN ============
  const isOrigin = phase === "origin";
  const q = isOrigin ? ORIGIN_QUESTIONS[current] : QUESTIONS[current];

  return (
    <div ref={topRef} style={{ minHeight: "100vh", background: "#F5F2ED", fontFamily: "'Montserrat', sans-serif" }}>
      <div style={{ background: "#2E2538", padding: "12px 24px" }}>
        <div style={{ maxWidth: 600, margin: "0 auto", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <span style={{ fontSize: 11, fontWeight: 700, color: "#D4764A", letterSpacing: "0.15em" }}>TIA CRENÇA</span>
          <span style={{ fontSize: 10, color: "#C4C2C9" }}>{isOrigin ? totalQ + current + 1 : current + 1} de {totalQ + totalO}</span>
        </div>
        <div style={{ maxWidth: 600, margin: "8px auto 0", height: 3, background: "rgba(255,255,255,0.06)", borderRadius: 2, overflow: "hidden" }}>
          <div style={{ height: "100%", width: `${globalProgress}%`, background: isOrigin ? "#8B4513" : "#D4764A", borderRadius: 2, transition: "width 0.4s ease" }} />
        </div>
      </div>

      <div style={{ maxWidth: 600, margin: "0 auto", padding: "24px 24px 48px" }}>
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 20 }}>
          <span style={{ fontSize: 10, fontWeight: 700, color: isOrigin ? "#8B4513" : "#D4764A", textTransform: "uppercase", letterSpacing: "0.12em" }}>
            {isOrigin ? "PARTE 2: PERGUNTAS DE ORIGEM" : "PARTE 1: CRENÇAS LIMITANTES"}
          </span>
          <span style={{ fontSize: 10, fontWeight: 600, color: "#8a8490" }}>
            {current + 1} de {isOrigin ? totalO : totalQ}
          </span>
        </div>

        <div style={{ background: "#fff", borderRadius: 16, padding: "28px 24px", boxShadow: "0 8px 32px rgba(46,37,56,0.06)", border: isOrigin ? "2px solid rgba(139,69,19,0.12)" : "1px solid rgba(0,0,0,0.04)" }}>
          <div style={{ display: "flex", gap: 8, marginBottom: 14, flexWrap: "wrap" }}>
            {isOrigin && <span style={{ fontSize: 9, fontWeight: 700, color: "#8B4513", background: "rgba(139,69,19,0.06)", padding: "3px 10px", borderRadius: 100 }}>ORIGEM</span>}
            {!isOrigin && q.inv && <span style={{ fontSize: 9, fontWeight: 700, color: "#D4764A", background: "rgba(212,118,74,0.08)", padding: "3px 10px", borderRadius: 100 }}>INVERTIDA</span>}
          </div>
          <p style={{ fontSize: 17, fontWeight: 700, color: "#1a1520", lineHeight: 1.5, marginBottom: 24 }}>"{q.t}"</p>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {LABELS.map((label, i) => {
              const val = i + 1;
              const isSel = selected === val;
              return (
                <button key={val} onClick={() => selectAnswer(val)} style={{
                  display: "flex", alignItems: "center", gap: 12, padding: "14px 16px",
                  background: isSel ? "rgba(212,118,74,0.08)" : "#F5F2ED",
                  border: isSel ? "2px solid #D4764A" : "2px solid transparent",
                  borderRadius: 10, cursor: "pointer", fontFamily: "inherit", textAlign: "left"
                }}>
                  <div style={{ flexShrink: 0, width: 32, height: 32, borderRadius: "50%", background: isSel ? "#D4764A" : "rgba(0,0,0,0.04)", color: isSel ? "#fff" : "#8a8490", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 800, fontSize: 14 }}>{val}</div>
                  <span style={{ fontSize: 13, fontWeight: isSel ? 700 : 500, color: isSel ? "#D4764A" : "#5a5060" }}>{label}</span>
                </button>
              );
            })}
          </div>
        </div>

        <div style={{ display: "flex", gap: 12, marginTop: 20 }}>
          <Btn disabled={phase === "quiz" && current === 0} onClick={goPrev} style={{ flex: 1 }}>Anterior</Btn>
          <Btn primary disabled={selected === null} onClick={goNext} style={{ flex: 2 }}>
            {phase === "quiz" && current === totalQ - 1 ? "Ir para Perguntas de Origem"
              : phase === "origin" && current === totalO - 1 ? "Ver meu diagnóstico"
              : "Próxima"}
          </Btn>
        </div>

        {isOrigin && current === 0 && (
          <div style={{ marginTop: 20, padding: 16, background: "rgba(139,69,19,0.04)", borderRadius: 10, border: "1px solid rgba(139,69,19,0.1)" }}>
            <p style={{ fontSize: 12, color: "#8B4513", lineHeight: 1.7, margin: 0, fontWeight: 500 }}>
              Estas 15 perguntas acessam a raiz das suas crenças. Conectam o que você acredita hoje ao momento da infância em que essa crença foi instalada. Pode trazer memórias emocionais. Isso é normal e faz parte do processo.
            </p>
          </div>
        )}

        {/* Save indicator */}
        <p style={{ textAlign: "center", fontSize: 10, color: "#8a8490", marginTop: 16 }}>
          ✓ Progresso salvo automaticamente
        </p>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(TiaCrencaApp));

</script>
</body>
</html>
